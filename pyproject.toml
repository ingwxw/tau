[project]
name = "tau-ai"
version = "0.1.0"
description = "A Python implementation of a Pi-style coding-agent harness"
readme = "README.md"
authors = [
    { name = "ingwxw", email = "3120454559@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.0",
    "httpx[socks]>=0.27",
    "pydantic>=2.11",
    "rich>=15.0.0",
    "textual>=8.2.8",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]
[tool.uv]
package = false
[project.scripts]
tau = "tau_coding.cli:main"
tau-tui = "tau_coding.tui.__main__:main"
